extensions:
  - ~/.omp/agent/extensions-last/system-prompt-replace/index.ts
setupVersion: 2
modelRoles:
  task: magpie/group/fusion-worker
  slow: magpie/group/philosopher
  plan: magpie/group/theorist
  advisor: magpie/group/fusion-deepthink
  smol: magpie/group/labor
  tiny: magpie/group/labor
  memory: magpie/group/labor
  commit: magpie/group/labor
  vision: magpie/group/flash-vibe
  default: magpie/group/fusion-hierarchical
dev:
  autoqaConsent: denied
composer:
  shape: band
github:
  enabled: true
astGrep:
  enabled: true
todo:
  enabled: false
task:
  eager: preferred
  maxRuntimeMs: 0
  disabledAgents:
    - scout
    - reviewer
    - security-reviewer
  agentModelOverrides:
    sonic: magpie/group/labor
    task: magpie/group/fusion-worker
  agentPrewalk:
    {}
  isolation:
    enabled: true
  enableLsp: false
  enableEffort: true
  maxConcurrency: 64
  maxEffort: high
fetch:
  enabled: true
browser:
  enabled: false
  headless: false
  cmux: false
cycleOrder:
  - slow
compaction:
  methodOrder:
    - remote
    - soft
    - snapcompact
    - handoff
    - shake
  thresholdTokens: 500000
codexResets:
  autoRedeem: "no"
lsp:
  enabled: false
inlineToolDescriptors: "on"
tools:
  xdevDocs: inline
checkpoint:
  enabled: true
eval:
  tools:
    enabled: false
edit:
  mode: apply_patch
computer:
  enabled: true
bashInterceptor:
  enabled: true
python:
  kernelMode: session
  interpreter: ""
readLineNumbers: true
textVerbosity: high
expandThinkingBlocks: true