# 本仓库的扩展配置。一个扩展一个顶层 section，section id 就是扩展目录名。
# 安装为 <agent dir>/omomp.yml。本机专属的 section（doc-polish、model-compaction）
# 只活在机器上，仓库不写。

tool-policy-nag:
  detector: heuristic
  form:
    prompt: 你为什么不遵守 system prompt。
    afterHits: 3
    maxNags: 3
  risk:
    minCommands: 4
    minChars: 600
    minPrograms: 3

task-completion-judge:
  model: magpie/group/fusion-flattened

task-split-check:
  model: magpie/group/fusion-flattened

child-memory-warning:
  thresholdGiB: 4

system-prompt-replace:
  replacements:
    - regex: 'Omit `agent` only for default \(`[^`]*`\); NEVER specify it\.'
      replace: Always set `agent` explicitly; never rely on the default.
    - regex: '(MUST use first for unknown locations; known strings/regex/symbols → `grep`, names → `glob`\.)'
      replace: '$1 `find` is judged by the judge role and costs one judgment per call; never re-issue the same query with small rewordings. Two weak results mean widen the question or fall back to `grep`/`glob` — and a known literal or symbol goes to `grep` directly.'
    - regex: '(Prefer it over \`task\` for complex work:)'
      replace: 'The copy is background only — the assignment is the brief, and a `shake` can elide its bulk while keeping recoverable artifacts. $1'
    - regex: '(Use this tool for session worktrees; never create, switch to, or remove worktrees yourself with `git worktree` or by changing directories\.)'
      replace: '$1 `git worktree` or a `cd` changes a directory, not the session''s cwd; the session would keep editing the wrong checkout while believing it moved. The same applies to leaving one: that is `wt_remove`, called twice — the first call only reports.'
    - literal: User-reported errors, failures, observations are ground truth; NEVER rerun checks to confirm them.
      replace: User-reported errors, failures, observations are ground truth; NEVER rerun checks to doubt them. Reproducing to locate the cause and confirming the fix still apply.
    - literal: 'Compiled code: NEVER avoidable allocation, copying, computation.'
      replace: 'Compiled code: NEVER add avoidable allocation, copying, computation.'
    - literal: 'On error, retry only the failed step; earlier steps may have taken effect.'
      replace: |-
        On error, retry only the failed step; earlier steps may have taken effect.
        Refuse to investigate files through `eval`: reading content (`open`, `Path.read_text`, `Bun.file`, `readFileSync`, the prelude `read()`), listing or finding files (`os.listdir`, `os.walk`, `glob.glob`, `readdirSync`), and searching text (regex over file content, `subprocess` running `cat`/`ls`/`find`/`grep`/`rg`) belong to `read`, `glob` and `grep`. A quick look, many files at once, or fewer tool calls are not exceptions. `eval` starts only where the work needs language semantics on data already in hand: computation, transforms, structured parsing, library calls.
    - regex: 'Write JSON args as `content` to `xd://<tool>` via `([^`]+)`\.'
      replace: 'Write JSON args as `content` to `xd://<tool>` via `$1`. Devices are not functions: no `xd__<tool>`, `xd_<tool>`, or bare `<tool>` function exists, so never call one; the only call is `$1` with `path` set to `xd://<tool>`.'
