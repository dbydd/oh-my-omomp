# omp-config unified extension configuration (omomp).
# One top-level section per extension; the section id is the extension's directory name.
# Installed as <agent dir>/omomp.yml. Machine-local sections (doc-polish, model-compaction,
# omp-config-autoupdate) live only on the machine and are never written from here.
lang-nag:
  model: openai-codex/gpt-6-luna
  language: 中文
  instruction: 说中文
input-polish:
  model: opencode-go/muse-spark-1.3-contributor:high
  key: ctrl+enter
  instruction: 在不改变原意的前提下，改写到听起来会让人更加想努力、能激动人心，但不要太夸张。
tool-policy-nag:
  form:
    detector: heuristic
  intent:
    threshold: 0.5
  risk:
    minCommands: 4
    minChars: 600
    minPrograms: 3
task-completion-judge:
  model: openai-codex/gpt-6-1-sol
task-split-check:
  model: openai-codex/gpt-6-1-sol
system-prompt-replace:
  replacements:
    - literal: "Use `read` for static web; browser only if needed."
      replace: "Use `read` as OMP's unified retrieval protocol, not merely as a file reader. One `path` selects both the source and its view: `<source><:selector>` or `<source>?<query>`. Sources include local files and directories, archive members, SQLite and JSON queries, documents and notebooks, images and video, web URLs, internal URIs, and POSIX SSH paths. Start with the bare source when you need structure or metadata, then re-read that source with an explicit range, view, or `:raw` selector for exact content. A non-raw read of a mutable local file records the snapshot and seen lines consumed by `edit`; `:raw` is exact and intentionally unanchored. Follow the result's recovery ranges and truncation notices rather than guessing omitted content. Full protocol, limits, and edge cases: `omp://tools/read.md`. Use `read` for static web content; use the browser when interaction or rendered page state is required."
    - literal: Use most specific agent.
      replace: "Choose a worker tier by cost and required trust, not task type, difficulty, ambiguity, code volume, or tool familiarity. Use `task:mid` by default; choose `task:low` when cost outweighs the extra judgment. Use `task:free` only for leads or probes whose mistakes are harmless or will be checked; a consequential free-tier result requires independent validation by the parent or a `task:low` or higher verifier that did not produce it. Free-tier agreement is not validation. Keep the operator's model bindings and role assignments unchanged."
    - regex: "Every task MUST skip build/lint/tests/formatters mid-flight; run once afterward\\.|No TODO tracking, no progress updates\\."
      replace: ""
    - literal: Shared edits need one integration owner
      replace: "Concurrent writers MUST use `isolated: true`, with non-overlapping file/state ownership and one integration owner. Research-only agents stay shared so they remain reachable. Use repository-relative paths for isolated assignments; identify pre-existing parent changes. Shared edits need one integration owner"
    - regex: "Omit `agent` only for default \\(`[^`]*`\\); NEVER specify it\\."
      replace: "Always set `agent` explicitly; never rely on the default. User says `parallel` or `parallelize` → use task subagents, not merely parallel tool calls. Omit per-spawn `effort` unless the user explicitly requests it; the configured agent binding chooses model and effort."
    - literal: "User-reported errors, failures, observations are ground truth; NEVER rerun checks to confirm them."
      replace: "User-reported errors, failures, observations are ground truth; NEVER rerun checks to doubt them. Reproducing to locate the cause and confirming the fix still apply."
    - literal: "Compiled code: NEVER avoidable allocation, copying, computation."
      replace: "Compiled code: NEVER add avoidable allocation, copying, computation."
    - literal: "On error, retry only the failed step; earlier steps may have taken effect."
      replace: "On error, retry only the failed step; earlier steps may have taken effect.\nRefuse to investigate files through `eval`: reading content (`open`, `Path.read_text`, `Bun.file`, `readFileSync`, the prelude `read()`), listing or finding files (`os.listdir`, `os.walk`, `glob.glob`, `readdirSync`), and searching text (regex over file content, `subprocess` running `cat`/`ls`/`find`/`grep`/`rg`) belong to `read`, `glob` and `grep`. A quick look, many files at once, or fewer tool calls are not exceptions. `eval` starts only where the work needs language semantics on data already in hand: computation, transforms, structured parsing, library calls."
    - regex: "Write JSON args as `content` to `xd://<tool>` via `([^`]+)`\\."
      replace: "Write JSON args as `content` to `xd://<tool>` via `$1`. Devices are not functions: no `xd__<tool>`, `xd_<tool>`, or bare `<tool>` function exists, so never call one; the only call is `$1` with `path` set to `xd://<tool>`."
